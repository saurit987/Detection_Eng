
title: Windows Failed Logon Attempt
id: 9b7c2e41-6a53-4f82-a8d1-3e9f6c1b2047
status: stable
description: Detects failed logon attempts on Windows systems.
author: Saurit
date: 2026-10-10
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection | count() by src_ip > 5
falsepositives:
    - Legitimate users entering invalid credentials
    
level: medium

